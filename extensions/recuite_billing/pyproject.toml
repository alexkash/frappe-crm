description = "Ukrainian invoices, acceptance acts and service contracts for Frappe CRM"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{name = "Recuite"}]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
